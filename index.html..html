<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Parking Match - Jeu de puzzle</title>
<meta name="description" content="Jeu de puzzle gratuit : envoyez les voitures au parking et alignez 3 couleurs identiques !">
<!-- ADSENSE : remplacez ca-pub-XXXXXXXXXXXXXXXX par votre identifiant éditeur -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(#1e88e5,#0d47a1);color:#fff;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700}
header .pill{background:rgba(0,0,0,.25);padding:6px 12px;border-radius:20px;font-size:15px}
.ad{width:100%;max-width:440px;min-height:60px;margin:4px 0;display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);border-radius:8px;font-size:11px;color:rgba(255,255,255,.5);overflow:hidden}
#wrap{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;padding:0 8px}
#road{flex:1;background:#4b5578;border-radius:18px;padding:12px 6px 6px;display:flex;gap:6px;justify-content:center;align-items:flex-end;min-height:260px;box-shadow:inset 0 0 0 4px #3a4363}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;max-width:90px}
.car{width:100%;margin-top:-34%;transition:transform .12s;filter:brightness(.7)}
.car svg{width:100%;display:block}
.car:first-child{margin-top:0}
.car.front{filter:none;cursor:pointer}
.car.front:active{transform:scale(.92)}
#parking{margin:10px 0;background:#2c3556;border-radius:14px;padding:8px;display:flex;gap:5px;justify-content:center}
.slot{flex:1;max-width:60px;aspect-ratio:1/1.15;border:2px dashed rgba(255,255,255,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:2px}
.slot svg{width:100%}
.slot.pop svg{animation:pop .25s}
.slot.match svg{animation:boom .35s forwards}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes boom{50%{transform:scale(1.25)}to{transform:scale(0);opacity:0}}
#tools{display:flex;gap:10px;justify-content:center;margin-bottom:6px}
button{font:inherit;font-weight:700;color:#fff;background:#ff9800;border:0;border-radius:24px;padding:10px 18px;cursor:pointer;box-shadow:0 3px 0 #b36b00}
button:disabled{opacity:.4}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5}
#modal .box{background:#fff;color:#222;border-radius:20px;padding:26px 30px;text-align:center;max-width:300px}
#modal h2{margin:0 0 8px}
</style>
</head>
<body>
<header>
  <span class="pill" id="lvl">Niveau 1</span>
  <span class="pill" id="score">⭐ 0</span>
</header>

<div class="ad" id="adTop">
  <!-- Bloc AdSense haut : remplacez data-ad-slot par votre bloc -->
  <ins class="adsbygoogle" style="display:block;width:100%;height:60px" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000001" data-ad-format="horizontal"></ins>
</div>

<div id="wrap">
  <div id="road"></div>
  <div id="parking"></div>
  <div id="tools">
    <button id="undo">↩ Annuler (3)</button>
    <button id="shuf">🔀 Mélanger (2)</button>
  </div>
</div>

<div class="ad" id="adBottom">
  <ins class="adsbygoogle" style="display:block;width:100%;height:60px" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000002" data-ad-format="horizontal"></ins>
</div>

<div id="modal"><div class="box"><h2 id="mt"></h2><p id="mp"></p><button id="mb"></button></div></div>

<script>
const COLORS=['#e53935','#fdd835','#43a047','#1e88e5','#8e24aa','#fb8c00','#00acc1'];
const MAX_SLOTS=7;
let level=1,score=0,cols=[],slots=[],history=[],undos=3,shufs=2,lock=false;
try{level=+localStorage.getItem('pm_level')||1;score=+localStorage.getItem('pm_score')||0}catch(e){}

const $=id=>document.getElementById(id);
function carSVG(c){
  return `<svg viewBox="0 0 50 64"><rect x="2" y="12" width="7" height="14" rx="3" fill="#222"/><rect x="41" y="12" width="7" height="14" rx="3" fill="#222"/><rect x="2" y="40" width="7" height="14" rx="3" fill="#222"/><rect x="41" y="40" width="7" height="14" rx="3" fill="#222"/><rect x="6" y="3" width="38" height="58" rx="13" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><rect x="12" y="34" width="26" height="12" rx="4" fill="rgba(255,255,255,.75)"/><rect x="13" y="14" width="24" height="9" rx="3" fill="rgba(255,255,255,.45)"/><circle cx="14" cy="57" r="3" fill="#fff7b0"/><circle cx="36" cy="57" r="3" fill="#fff7b0"/></svg>`;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function newLevel(){
  const nColors=Math.min(3+Math.floor(level/2),7);
  const nCols=Math.min(3+Math.floor(level/3),5);
  const sets=Math.min(2+Math.floor(level/2),6); // groupes de 3 par couleur
  let cars=[];
  for(let c=0;c<nColors;c++)for(let k=0;k<sets*3;k++)cars.push(c);
  shuffle(cars);
  cols=Array.from({length:nCols},()=>[]);
  cars.forEach((c,i)=>cols[i%nCols].push(c));
  slots=[];history=[];undos=3;shufs=2;lock=false;
  render();
}

function render(){
  $('lvl').textContent='Niveau '+level;
  $('score').textContent='⭐ '+score;
  $('undo').textContent='↩ Annuler ('+undos+')';
  $('shuf').textContent='🔀 Mélanger ('+shufs+')';
  $('undo').disabled=!undos||!history.length||lock;
  $('shuf').disabled=!shufs||lock;
  const road=$('road');road.innerHTML='';
  cols.forEach((col,ci)=>{
    const d=document.createElement('div');d.className='col';
    col.forEach((c,i)=>{
      const e=document.createElement('div');
      e.className='car'+(i===col.length-1?' front':'');
      e.innerHTML=carSVG(COLORS[c]);
      if(i===col.length-1)e.onclick=()=>play(ci);
      d.appendChild(e);
    });
    road.appendChild(d);
  });
  const p=$('parking');p.innerHTML='';
  for(let i=0;i<MAX_SLOTS;i++){
    const s=document.createElement('div');s.className='slot';
    if(slots[i]!==undefined)s.innerHTML=carSVG(COLORS[slots[i]]);
    p.appendChild(s);
  }
}

function play(ci){
  if(lock||!cols[ci].length||slots.length>=MAX_SLOTS)return;
  history.push(JSON.stringify({cols,slots}));
  const c=cols[ci].pop();
  // insère à côté des voitures de même couleur
  let idx=slots.lastIndexOf(c);
  if(idx>=0)slots.splice(idx+1,0,c);else slots.push(c);
  render();
  const newIdx=slots.lastIndexOf(c);
  const el=$('parking').children[idx>=0?idx+1:newIdx];
  if(el)el.classList.add('pop');
  check();
}

function check(){
  const counts={};slots.forEach(c=>counts[c]=(counts[c]||0)+1);
  const m=Object.keys(counts).find(k=>counts[k]>=3);
  if(m!==undefined){
    lock=true;
    let n=0;
    [...$('parking').children].forEach((el,i)=>{if(slots[i]==m&&n<3){el.classList.add('match');n++}});
    setTimeout(()=>{
      let r=0;slots=slots.filter(c=>{if(c==m&&r<3){r++;return false}return true});
      score+=30;lock=false;render();check();
    },380);
    return;
  }
  if(cols.every(c=>!c.length)&&!slots.length)return win();
  if(slots.length>=MAX_SLOTS)return lose();
}

function modal(t,p,b,fn){$('mt').textContent=t;$('mp').textContent=p;$('mb').textContent=b;$('mb').onclick=()=>{$('modal').style.display='none';fn()};$('modal').style.display='flex'}
function win(){
  score+=100;level++;
  try{localStorage.setItem('pm_level',level);localStorage.setItem('pm_score',score)}catch(e){}
  modal('🎉 Bravo !','Niveau terminé (+100 ⭐)','Niveau suivant',newLevel);
}
function lose(){modal('Parking plein 😬','Il n\'y a plus de place.','Réessayer',newLevel)}

$('undo').onclick=()=>{
  if(!undos||!history.length||lock)return;
  const s=JSON.parse(history.pop());cols=s.cols;slots=s.slots;undos--;render();
};
$('shuf').onclick=()=>{
  if(!shufs||lock)return;
  const sizes=cols.map(c=>c.length);
  const all=shuffle(cols.flat());
  let k=0;cols=sizes.map(n=>all.slice(k,k+=n));
  shufs--;render();
};

// Charge les pubs (ignore les erreurs si AdSense n'est pas encore validé)
document.querySelectorAll('.adsbygoogle').forEach(()=>{try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}});
newLevel();
</script>
</body>
</html>
